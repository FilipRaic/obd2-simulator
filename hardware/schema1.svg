<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="770" viewBox="0 0 1600 770"><!-- Generated by hardware/kicad/scripts/generate_figures.py. Repository figure, English. The project's written documentation uses a separate figure set from its own generator, with the same file names but different drawings. Edit this file by editing the generator, never by hand. --><rect width="1600" height="770" fill="#ffffff"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="46" font-size="26" font-weight="700" fill="#1c2733">Schematic 1: power section</text><text x="40" y="72" font-size="15" fill="#5c6b7a">USB-C PD 12 V -> pin 16 of the J1962 connector (tool power) and -> 3.3 V for the logic. Revision v0.7</text><line x1="40" y1="88" x2="1560" y2="88" stroke="#8fa0b0" stroke-width="2"/><rect x="60" y="250" width="150" height="130" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="135" y="274" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">J1</text><text x="135" y="296" text-anchor="middle" font-size="13" fill="#5c6b7a">USB-C 16 pin</text><text x="135" y="313" text-anchor="middle" font-size="13" fill="#5c6b7a">VBUS</text><text x="135" y="330" text-anchor="middle" font-size="13" fill="#5c6b7a">CC1 / CC2</text><text x="135" y="347" text-anchor="middle" font-size="13" fill="#5c6b7a">DP / DM</text><rect x="300" y="250" width="230" height="190" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="415" y="274" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">CH224K (U1)</text><text x="415" y="296" text-anchor="middle" font-size="13" fill="#5c6b7a">USB-C PD sink</text><text x="415" y="313" text-anchor="middle" font-size="13" fill="#5c6b7a">ESSOP-10</text><text x="415" y="330" text-anchor="middle" font-size="13" fill="#5c6b7a">requests the 12 V profile</text><text x="415" y="347" text-anchor="middle" font-size="13" fill="#5c6b7a">Rd on CC built in</text><path d="M 210 300 L 300 300" fill="none" stroke="#1c2733" stroke-width="2"/><text x="215" y="290" text-anchor="start" font-size="12" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">CC1, CC2</text><text x="60" y="405" text-anchor="start" font-size="12" fill="#b03030" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">DP, DM: NOT connected</text><path d="M 135 250 L 135 130 L 1420 130" fill="none" stroke="#b8860b" stroke-width="3"/><circle cx="135" cy="250" r="4" fill="#b8860b"/><text x="560" y="118" text-anchor="start" font-size="14" fill="#b8860b" font-weight="700">VBUS = 12 V after the PD contract (5 V on plug-in)</text><path d="M 415 130 L 415 250" fill="none" stroke="#1c2733" stroke-width="2"/><circle cx="415" cy="130" r="4" fill="#b8860b"/><text x="425" y="200" text-anchor="start" font-size="12" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">R21 = 1 kΩ -&gt; VDD, C22 = 1 µF</text><path d="M 530 340 L 620 340" fill="none" stroke="#1c2733" stroke-width="2"/><text x="540" y="330" text-anchor="start" font-size="12" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">R22 = 10 kΩ (sense)</text><path d="M 620 340 L 620 130" fill="none" stroke="#1c2733" stroke-width="2"/><circle cx="620" cy="130" r="4" fill="#b8860b"/><path d="M 415 440 L 415 480" fill="none" stroke="#b8860b" stroke-width="2"/><rect x="300" y="480" width="300" height="70" rx="6" fill="#fff6e0" stroke="#b8860b" stroke-width="2"/><text x="450" y="504" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">R23 = 24 kΩ</text><text x="450" y="526" text-anchor="middle" font-size="13" fill="#5c6b7a">CFG1 -&gt; ground = 12 V</text><path d="M 450 550 L 450 580" fill="none" stroke="#1c2733" stroke-width="2"/><path d="M 450 580 L 450 594" fill="none" stroke="#1c2733" stroke-width="2"/><line x1="439" y1="594" x2="461" y2="594" stroke="#1c2733" stroke-width="2"/><line x1="443" y1="599" x2="457" y2="599" stroke="#1c2733" stroke-width="2"/><line x1="447" y1="604" x2="453" y2="604" stroke="#1c2733" stroke-width="2"/><text x="620" y="545" text-anchor="start" font-size="12" fill="#5c6b7a" font-weight="400">6.8 k = 9 V   ·   24 k = 12 V   ·   56 k = 15 V   ·   NC = 20 V</text><circle cx="860" cy="130" r="4" fill="#b8860b"/><path d="M 860 130 L 860 200" fill="none" stroke="#b8860b" stroke-width="3"/><rect x="790" y="200" width="110" height="70" rx="6" fill="#fff6e0" stroke="#b8860b" stroke-width="2"/><text x="845" y="224" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">F1</text><text x="845" y="246" text-anchor="middle" font-size="13" fill="#5c6b7a">PTC 500 mA</text><path d="M 900 235 L 950 235" fill="none" stroke="#b8860b" stroke-width="3"/><rect x="950" y="200" width="130" height="70" rx="6" fill="#ffe9d6" stroke="#b03030" stroke-width="2"/><text x="1015" y="224" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">D3</text><text x="1015" y="246" text-anchor="middle" font-size="13" fill="#5c6b7a">SMAJ16A blocking</text><text x="1015" y="263" text-anchor="middle" font-size="13" fill="#5c6b7a">anode on F1</text><path d="M 1080 235 L 1130 235" fill="none" stroke="#b8860b" stroke-width="3"/><rect x="1130" y="200" width="120" height="70" rx="6" fill="#fff6e0" stroke="#b8860b" stroke-width="2"/><text x="1190" y="224" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">D2</text><text x="1190" y="246" text-anchor="middle" font-size="13" fill="#5c6b7a">TVS SMAJ16A</text><text x="1190" y="263" text-anchor="middle" font-size="13" fill="#5c6b7a">cathode on 12 V</text><path d="M 1190 270 L 1190 310" fill="none" stroke="#1c2733" stroke-width="2"/><path d="M 1190 310 L 1190 324" fill="none" stroke="#1c2733" stroke-width="2"/><line x1="1179" y1="324" x2="1201" y2="324" stroke="#1c2733" stroke-width="2"/><line x1="1183" y1="329" x2="1197" y2="329" stroke="#1c2733" stroke-width="2"/><line x1="1187" y1="334" x2="1193" y2="334" stroke="#1c2733" stroke-width="2"/><path d="M 1250 235 L 1300 235" fill="none" stroke="#b8860b" stroke-width="3"/><rect x="1300" y="200" width="160" height="130" rx="6" fill="#fff6e0" stroke="#b8860b" stroke-width="2"/><text x="1380" y="224" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">J1962F (J2)</text><text x="1380" y="246" text-anchor="middle" font-size="13" fill="#5c6b7a">pin 16: +12 V</text><text x="1380" y="263" text-anchor="middle" font-size="13" fill="#5c6b7a">pin 6/14: CAN-H/L</text><text x="1380" y="280" text-anchor="middle" font-size="13" fill="#5c6b7a">pin 4/5: ground</text><text x="790" y="300" text-anchor="start" font-size="14" fill="#b8860b" font-weight="600">powers the diagnostic tool, just like a vehicle</text><circle cx="760" cy="130" r="4" fill="#b8860b"/><path d="M 760 130 L 760 440 L 860 440" fill="none" stroke="#b8860b" stroke-width="3"/><rect x="860" y="400" width="220" height="130" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="970" y="424" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">TPS562201 (U2)</text><text x="970" y="446" text-anchor="middle" font-size="13" fill="#5c6b7a">step-down converter</text><text x="970" y="463" text-anchor="middle" font-size="13" fill="#5c6b7a">input 4.5 - 17 V, output 2 A</text><text x="970" y="480" text-anchor="middle" font-size="13" fill="#5c6b7a">L2 = 4.7 µH, C3/C4 = 22 µF low ESR</text><text x="970" y="497" text-anchor="middle" font-size="13" fill="#5c6b7a">FB 51 k / (15 k + 470 Ω)</text><text x="970" y="514" text-anchor="middle" font-size="13" fill="#5c6b7a">C21 bootstrap 5.8 mm from the BST pin</text><path d="M 1080 460 L 1240 460" fill="none" stroke="#2e7d4f" stroke-width="3"/><text x="1100" y="450" text-anchor="start" font-size="15" fill="#2e7d4f" font-weight="700" font-family="DejaVu Sans Mono, Consolas, monospace">+3.3 V</text><rect x="1240" y="425" width="300" height="70" rx="6" fill="#eef7f1" stroke="#2e7d4f" stroke-width="2"/><text x="1390" y="449" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">device logic</text><text x="1390" y="471" text-anchor="middle" font-size="13" fill="#5c6b7a">ESP32-S3, MCP2515, SN65HVD230, ILI9341, S25FL128L</text><path d="M 970 530 L 970 565" fill="none" stroke="#1c2733" stroke-width="2"/><path d="M 970 565 L 970 579" fill="none" stroke="#1c2733" stroke-width="2"/><line x1="959" y1="579" x2="981" y2="579" stroke="#1c2733" stroke-width="2"/><line x1="963" y1="584" x2="977" y2="584" stroke="#1c2733" stroke-width="2"/><line x1="967" y1="589" x2="973" y2="589" stroke="#1c2733" stroke-width="2"/><circle cx="1200" cy="130" r="4" fill="#b8860b"/><path d="M 1200 130 L 1200 555 L 1240 555" fill="none" stroke="#b8860b" stroke-width="3"/><rect x="1240" y="520" width="300" height="100" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="1390" y="544" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">TPS562201 (U11)</text><text x="1390" y="566" text-anchor="middle" font-size="13" fill="#5c6b7a">second step-down converter, 5 V</text><text x="1390" y="583" text-anchor="middle" font-size="13" fill="#5c6b7a">L3 = 4.7 µH, FB R24/R25 = 51 k / 9.31 k</text><text x="1390" y="600" text-anchor="middle" font-size="13" fill="#5c6b7a">C37 = 10 µF at the U10 switch input</text><text x="1150" y="650" text-anchor="start" font-size="13" fill="#2e7d4f" font-weight="600">the 5 V output powers the USB stick through switch U10</text><text x="60" y="650" text-anchor="start" font-size="14" fill="#5c6b7a" font-weight="400">The converter input range (4.5 - 17 V) covers both the 5 V before the PD contract and the 12 V after it, so the logic comes up either way.</text><text x="60" y="676" text-anchor="start" font-size="14" fill="#5c6b7a" font-weight="400">The charger has to support the 12 V PD profile (20 W or more). Peak input load is about 12 W, that is 1 A at 12 V.</text><text x="60" y="712" text-anchor="start" font-size="14" fill="#b03030" font-weight="400">D3 (SMAJ16A forward biased) passes the board -&gt; tool direction only. Fuse F1 is a PTC and conducts both ways, so without the diode an external 12 V</text><text x="60" y="736" text-anchor="start" font-size="14" fill="#b03030" font-weight="400">from a tool that powers pin 16 itself would flow back into VBUS, into both converter inputs and onto the USB-C connector VBUS.</text></g></svg>