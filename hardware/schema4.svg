<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110"><!-- Generated by hardware/kicad/scripts/generate_figures.py. Repository figure, English. The project's written documentation uses a separate figure set from its own generator, with the same file names but different drawings. Edit this file by editing the generator, never by hand. --><rect width="1600" height="1110" fill="#ffffff"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="46" font-size="26" font-weight="700" fill="#1c2733">Schematic 4: user interface section</text><text x="40" y="72" font-size="15" fill="#5c6b7a">ILI9341, encoder ENC1, the 5-way switch SW6 and the CONFIRM / CLEAR / RETURN buttons. Revision v0.7, with the encoder filter at both ends</text><line x1="40" y1="88" x2="1560" y2="88" stroke="#8fa0b0" stroke-width="2"/><rect x="80" y="140" width="260" height="200" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="210" y="164" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">Waveshare 18366 (on J5)</text><text x="210" y="186" text-anchor="middle" font-size="13" fill="#5c6b7a">ILI9341, 2.4 inch TFT, 320 × 240</text><text x="210" y="203" text-anchor="middle" font-size="13" fill="#5c6b7a">SPI (no MISO), no touch</text><text x="210" y="220" text-anchor="middle" font-size="13" fill="#5c6b7a">BL input through R8 = 33 Ω</text><text x="210" y="237" text-anchor="middle" font-size="13" fill="#5c6b7a">external module, on header J5</text><path d="M 340 170 L 470 170" fill="none" stroke="#1c2733" stroke-width="2"/><text x="475" y="175" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO14  CS-TFT</text><path d="M 340 200 L 470 200" fill="none" stroke="#1c2733" stroke-width="2"/><text x="475" y="205" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO21  DC/RS</text><path d="M 340 230 L 470 230" fill="none" stroke="#1c2733" stroke-width="2"/><text x="475" y="235" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO47  RST-TFT</text><path d="M 340 270 L 470 270" fill="none" stroke="#1c2733" stroke-width="2"/><text x="475" y="275" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">MOSI/SCK (no MISO)  SPI</text><rect x="80" y="400" width="260" height="110" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="210" y="424" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">ENC1</text><text x="210" y="446" text-anchor="middle" font-size="13" fill="#5c6b7a">encoder EN11-HSB1AQ20</text><text x="210" y="463" text-anchor="middle" font-size="13" fill="#5c6b7a">20 pulses per revolution, with a push button</text><text x="210" y="480" text-anchor="middle" font-size="13" fill="#5c6b7a">A -&gt; GPIO1, B -&gt; GPIO38, button -&gt; GPIO39</text><path d="M 340 455 L 378 455" fill="none" stroke="#1c2733" stroke-width="2"/><rect x="378" y="400" width="190" height="110" rx="6" fill="#ffe9d6" stroke="#b03030" stroke-width="2"/><text x="473" y="424" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">R38-R40, R32-R34, C31-C33</text><text x="473" y="446" text-anchor="middle" font-size="13" fill="#5c6b7a">100 Ω in series at the contact</text><text x="473" y="463" text-anchor="middle" font-size="13" fill="#5c6b7a">pull-up 10 kΩ to +3.3 V</text><text x="473" y="480" text-anchor="middle" font-size="13" fill="#5c6b7a">47 nF to ground</text><path d="M 568 455 L 600 455" fill="none" stroke="#1c2733" stroke-width="2"/><rect x="600" y="415" width="150" height="80" rx="6" fill="#ffe9d6" stroke="#b03030" stroke-width="2"/><text x="675" y="439" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">C34-C36</text><text x="675" y="461" text-anchor="middle" font-size="13" fill="#5c6b7a">1 nF to ground</text><text x="675" y="478" text-anchor="middle" font-size="13" fill="#5c6b7a">at the module pin</text><path d="M 750 455 L 760 455" fill="none" stroke="#1c2733" stroke-width="2"/><text x="600" y="405" text-anchor="start" font-size="12" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO1 / 38 / 39</text><rect x="80" y="550" width="260" height="130" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="210" y="574" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">SW6</text><text x="210" y="596" text-anchor="middle" font-size="13" fill="#5c6b7a">Alps SKRHABE010, 5 directions</text><text x="210" y="613" text-anchor="middle" font-size="13" fill="#5c6b7a">X axis -&gt; GPIO2 (ADC1_CH1)</text><text x="210" y="630" text-anchor="middle" font-size="13" fill="#5c6b7a">Y axis -&gt; GPIO4 (ADC1_CH3)</text><text x="210" y="647" text-anchor="middle" font-size="13" fill="#5c6b7a">click -&gt; GPIO5; R26-R29 ladder</text><path d="M 340 615 L 470 615" fill="none" stroke="#1c2733" stroke-width="2"/><text x="475" y="620" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO2 / GPIO4 / GPIO5</text><rect x="80" y="720" width="260" height="55" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="210" y="753" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">SW1 CONFIRM</text><path d="M 340 747 L 470 747" fill="none" stroke="#1c2733" stroke-width="2"/><text x="475" y="752" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO6  (pull-up 10 kΩ, active low)</text><rect x="80" y="790" width="260" height="55" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="210" y="823" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">SW2 CLEAR</text><path d="M 340 817 L 470 817" fill="none" stroke="#1c2733" stroke-width="2"/><text x="475" y="822" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO7  (pull-up 10 kΩ, active low)</text><rect x="80" y="860" width="260" height="55" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="210" y="893" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">SW3 RETURN</text><path d="M 340 887 L 470 887" fill="none" stroke="#1c2733" stroke-width="2"/><text x="475" y="892" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO8  (pull-up 10 kΩ, active low)</text><rect x="760" y="300" width="300" height="320" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="910" y="324" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">ESP32-S3-WROOM-1 (U6)</text><text x="910" y="346" text-anchor="middle" font-size="13" fill="#5c6b7a">GPIO1, GPIO2, GPIO4: ADC1</text><text x="910" y="363" text-anchor="middle" font-size="13" fill="#5c6b7a">GPIO5 - GPIO8: digital inputs</text><text x="910" y="380" text-anchor="middle" font-size="13" fill="#5c6b7a">GPIO14, GPIO21, GPIO47: display</text><path d="M 700 455 L 760 455" fill="none" stroke="#8fa0b0" stroke-width="2"/><text x="760" y="660" text-anchor="start" font-size="14" fill="#5c6b7a" font-weight="400">The external pull-up resistors R9 - R12 (10 kΩ) are kept for noise immunity,</text><text x="760" y="684" text-anchor="start" font-size="14" fill="#5c6b7a" font-weight="400">even though the ESP32-S3 has internal pull-ups too. The same goes for the encoder (R32 - R34).</text><rect x="760" y="140" width="300" height="110" rx="6" fill="#fff6e0" stroke="#b8860b" stroke-width="2"/><text x="910" y="164" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">J1962F</text><text x="910" y="186" text-anchor="middle" font-size="13" fill="#5c6b7a">OBD-II connector along the top edge,</text><text x="910" y="203" text-anchor="middle" font-size="13" fill="#5c6b7a">above the display</text><text x="910" y="220" text-anchor="middle" font-size="13" fill="#5c6b7a">pin 16 carries 12 V for the tool</text><text x="80" y="955" text-anchor="start" font-size="14" fill="#b03030" font-weight="400">Encoder: A and B are decoded in an interrupt, where mechanical contact bounce produces false steps. That is why each of the three</text><text x="80" y="979" text-anchor="start" font-size="14" fill="#b03030" font-weight="400">contacts has 100 Ω in series, a 10 kΩ pull-up to 3.3 V and 47 nF to ground. The series resistor protects the contact from the discharge current,</text><text x="80" y="1003" text-anchor="start" font-size="14" fill="#b03030" font-weight="400">and the firmware still debounces. Without that filter, A, B and the button would hang on the internal pull-ups alone.</text><text x="80" y="1037" text-anchor="start" font-size="14" fill="#b03030" font-weight="400">The second capacitor (C34 - C36, 1 nF each) sits right at the module input pin, 4.3 to 11.0 mm from it. Past the filter at the encoder</text><text x="80" y="1061" text-anchor="start" font-size="14" fill="#b03030" font-weight="400">the signal travels another 125 to 154 mm across the board, alongside the SPI bus, and the node is high impedance (10 kΩ). That capacitor does not</text><text x="80" y="1085" text-anchor="start" font-size="14" fill="#b03030" font-weight="400">serve debouncing but shunts picked-up noise right at the input, which is why it is 1 nF and not 47 nF.</text></g></svg>