<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="590" viewBox="0 0 1600 590"><!-- Generated by hardware/kicad/scripts/generate_figures.py. Repository figure, English. The project's written documentation uses a separate figure set from its own generator, with the same file names but different drawings. Edit this file by editing the generator, never by hand. --><rect width="1600" height="590" fill="#ffffff"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="46" font-size="26" font-weight="700" fill="#1c2733">Schematic 2: CAN interface</text><text x="40" y="72" font-size="15" fill="#5c6b7a">MCP2515 -> SN65HVD230 -> ESD protection -> J1962F connector. The 120 Ω termination and the ESD sit just outside the connector body. Revision v0.7</text><line x1="40" y1="88" x2="1560" y2="88" stroke="#8fa0b0" stroke-width="2"/><rect x="60" y="150" width="230" height="230" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="175" y="174" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">MCP2515 (U4)</text><text x="175" y="196" text-anchor="middle" font-size="13" fill="#5c6b7a">CAN 2.0B controller, SPI</text><text x="175" y="213" text-anchor="middle" font-size="13" fill="#5c6b7a">crystal Y1 = 8 MHz</text><text x="175" y="230" text-anchor="middle" font-size="13" fill="#5c6b7a">C6, C7 = 22 pF</text><text x="175" y="247" text-anchor="middle" font-size="13" fill="#5c6b7a">500 kbit/s</text><path d="M 60 170 L 0 170" fill="none" stroke="#8fa0b0" stroke-width="0"/><text x="2" y="166" text-anchor="start" font-size="12" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">MOSI (GPIO11)</text><path d="M 60 200 L 0 200" fill="none" stroke="#8fa0b0" stroke-width="0"/><text x="2" y="196" text-anchor="start" font-size="12" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">MISO (GPIO13)</text><path d="M 60 230 L 0 230" fill="none" stroke="#8fa0b0" stroke-width="0"/><text x="2" y="226" text-anchor="start" font-size="12" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">SCK (GPIO12)</text><path d="M 60 260 L 0 260" fill="none" stroke="#8fa0b0" stroke-width="0"/><text x="2" y="256" text-anchor="start" font-size="12" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">CS-CAN (GPIO10)</text><path d="M 60 290 L 0 290" fill="none" stroke="#8fa0b0" stroke-width="0"/><text x="2" y="286" text-anchor="start" font-size="12" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">INT-CAN (GPIO9)</text><text x="2" y="326" text-anchor="start" font-size="12" fill="#b8860b" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">to ESP32-S3 (U6)</text><path d="M 290 200 L 420 200" fill="none" stroke="#1c2733" stroke-width="2"/><text x="310" y="190" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">TXCAN</text><path d="M 290 250 L 420 250" fill="none" stroke="#1c2733" stroke-width="2"/><text x="310" y="240" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">RXCAN</text><rect x="420" y="150" width="200" height="180" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="520" y="174" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">SN65HVD230 (U5)</text><text x="520" y="196" text-anchor="middle" font-size="13" fill="#5c6b7a">3.3 V transceiver</text><text x="520" y="213" text-anchor="middle" font-size="13" fill="#5c6b7a">RS to ground (high-speed mode)</text><text x="520" y="230" text-anchor="middle" font-size="13" fill="#5c6b7a">ISO 11898</text><path d="M 620 200 L 870 200" fill="none" stroke="#b03030" stroke-width="3"/><text x="640" y="190" text-anchor="start" font-size="13" fill="#b03030" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">CAN-H</text><path d="M 620 250 L 870 250" fill="none" stroke="#2a5db0" stroke-width="3"/><text x="640" y="265" text-anchor="start" font-size="13" fill="#2a5db0" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">CAN-L</text><circle cx="700" cy="200" r="4" fill="#b03030"/><circle cx="700" cy="250" r="4" fill="#2a5db0"/><rect x="680" y="205" width="40" height="40" fill="none" stroke="#1c2733" stroke-width="2"/><text x="660" y="285" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">R7 = 120 Ω</text><rect x="870" y="150" width="170" height="150" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="955" y="174" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">D1</text><text x="955" y="196" text-anchor="middle" font-size="13" fill="#5c6b7a">PESD1CAN</text><text x="955" y="213" text-anchor="middle" font-size="13" fill="#5c6b7a">CAN ESD protection</text><text x="955" y="230" text-anchor="middle" font-size="13" fill="#5c6b7a">SOT-23</text><path d="M 1040 200 L 1080 200" fill="none" stroke="#b03030" stroke-width="3"/><path d="M 1040 250 L 1080 250" fill="none" stroke="#2a5db0" stroke-width="3"/><rect x="1080" y="120" width="200" height="260" rx="6" fill="#fff6e0" stroke="#b8860b" stroke-width="2"/><text x="1180" y="144" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">J1962F (J2)</text><text x="1180" y="166" text-anchor="middle" font-size="13" fill="#5c6b7a">pin 6: CAN-H</text><text x="1180" y="183" text-anchor="middle" font-size="13" fill="#5c6b7a">pin 14: CAN-L</text><text x="1180" y="200" text-anchor="middle" font-size="13" fill="#5c6b7a">pin 4, 5: ground</text><text x="1180" y="217" text-anchor="middle" font-size="13" fill="#5c6b7a">pin 16: +12 V</text><path d="M 1180 380 L 1180 420 L 1360 420" fill="none" stroke="#b8860b" stroke-width="3"/><rect x="1360" y="385" width="180" height="70" rx="6" fill="#fff6e0" stroke="#b8860b" stroke-width="2"/><text x="1450" y="409" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">12 V from schematic 1</text><text x="1450" y="431" text-anchor="middle" font-size="13" fill="#5c6b7a">through F1, D3 and D2</text><circle cx="800" cy="200" r="4" fill="#b03030"/><circle cx="800" cy="250" r="4" fill="#2a5db0"/><path d="M 800 200 L 800 150" fill="none" stroke="#8fa0b0" stroke-width="2"/><path d="M 800 250 L 770 250 L 770 320" fill="none" stroke="#8fa0b0" stroke-width="2"/><text x="775" y="140" text-anchor="start" font-size="12" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">TP3</text><text x="740" y="340" text-anchor="start" font-size="12" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">TP4</text><text x="60" y="430" text-anchor="start" font-size="14" fill="#5c6b7a" font-weight="400">C12, C5 = decoupling capacitors at the supply pins of both chips (9.0 and 13.5 mm from the pin).</text><text x="60" y="454" text-anchor="start" font-size="14" fill="#b03030" font-weight="400">The pair is routed by a dedicated script BEFORE Freerouting, so the chain is unbroken, with no branches and not a single</text><text x="60" y="478" text-anchor="start" font-size="14" fill="#b03030" font-weight="400">via, entirely on the top layer. Machine routed, the pair had the ESD diode on a 13.0 mm stub (CANH) and 4.3 mm (CANL), and CANL</text><text x="60" y="502" text-anchor="start" font-size="14" fill="#b03030" font-weight="400">had a via. Test points TP3 and TP4 are in line, between the termination and the ESD diode.</text><text x="60" y="530" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400">The pair length mismatch is about 20 mm and cannot be smaller: it comes from the R7 leads spaced 10.16 mm apart and the two pin rows</text><text x="60" y="552" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400">of the J1962F connector spaced 8.6 mm apart. At 500 kbit/s that is 0.13 ns on a 2000 ns bit.</text></g></svg>