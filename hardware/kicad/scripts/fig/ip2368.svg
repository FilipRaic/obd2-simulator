l="none" stroke="#b8860b" stroke-width="3"/><rect x="1120" y="295" width="300" height="80" rx="6" fill="#fff6e0" stroke="#b8860b" stroke-width="2"/><text x="1270" y="319" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">R23 = 24 kΩ</text><text x="1270" y="341" text-anchor="middle" font-size="13" fill="#5c6b7a">CFG1 (pin 9) -&gt; ground = 12 V</text><path d="M 1270 375 L 1270 415" fill="none" stroke="#1c2733" stroke-width="2"/><path d="M 1270 415 L 1270 429" fill="none" stroke="#1c2733" stroke-width="2"/><line x1="1259" y1="429" x2="1281" y2="429" stroke="#1c2733" stroke-width="2"/><line x1="1263" y1="434" x2="1277" y2="434" stroke="#1c2733" stroke-width="2"/><line x1="1267" y1="439" x2="1273" y2="439" stroke="#1c2733" stroke-width="2"/><text x="950" y="320" text-anchor="start" font-size="13" fill="#b8860b" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">CFG1</text><text x="1120" y="450" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400">6.8 kΩ = 9 V   ·   24 kΩ = 12 V   ·   56 kΩ = 15 V   ·   NC = 20 V</text><text x="140" y="560" text-anchor="start" font-size="14" fill="#5c6b7a" font-weight="400">CFG2 and CFG3 stay unconnected (single resistor selection). The chip ground is the exposed pad only (pin 0).</text><text x="140" y="586" text-anchor="start" font-size="14" fill="#5c6b7a" font-weight="400">The pinout was checked against the reference schematic in the WCH CH224DS1 datasheet, not against the pin table, which lists a different CFG pin order.</text></g></svg>