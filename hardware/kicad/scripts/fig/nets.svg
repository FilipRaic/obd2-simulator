9 ladder</text><rect x="60" y="434" width="1480" height="54" fill="#ffffff" stroke="#8fa0b0" stroke-width="1"/><text x="80" y="467" text-anchor="start" font-size="14" fill="#1c2733" font-weight="600">Encoder</text><text x="380" y="467" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">ENC-A GPIO1, ENC-B GPIO38, ENC-SW GPIO39</text><text x="1050" y="467" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">100 R in series, pull-up 10 kΩ and 47 nF at the encoder, another 1 nF at the module pin</text><rect x="60" y="488" width="1480" height="54" fill="#fafbfc" stroke="#8fa0b0" stroke-width="1"/><text x="80" y="521" text-anchor="start" font-size="14" fill="#1c2733" font-weight="600">Buttons</text><text x="380" y="521" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">JOY-SW GPIO5, SW1 GPIO6, SW2 GPIO7, SW3 GPIO8</text><text x="1050" y="521" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">active low, pull-up 10 kΩ</text><rect x="60" y="542" width="1480" height="54" fill="#ffffff" stroke="#8fa0b0" stroke-width="1"/><text x="80" y="575" text-anchor="start" font-size="14" fill="#1c2733" font-weight="600">USB</text><text x="380" y="575" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">USB-SEL GPIO16, USB-HOST-EN GPIO17, D-/D+ GPIO19/20</text><text x="1050" y="575" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">D-/D+ routed together, two vias each, mostly on the bottom layer</text><rect x="60" y="596" width="1480" height="54" fill="#fafbfc" stroke="#8fa0b0" stroke-width="1"/><text x="80" y="629" text-anchor="start" font-size="14" fill="#1c2733" font-weight="600">CAN pair</text><text x="380" y="629" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">CAN-H, CAN-L</text><text x="1050" y="629" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">0.20 mm, chain with no stubs and no vias, entirely on the top layer</text><rect x="60" y="650" width="1480" height="54" fill="#ffffff" stroke="#8fa0b0" stroke-width="1"/><text x="80" y="683" text-anchor="start" font-size="14" fill="#1c2733" font-weight="600">Test points</text><text x="380" y="683" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">TP1 3V3, TP2 GND, TP3/TP4 CAN, TP5-TP7 SPI, TP8 VBUS</text><text x="1050" y="683" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">each at the pad of its own net, stub 4 to 5 mm (TP1/TP2 up to 15 mm)</text><rect x="60" y="704" width="1480" height="54" fill="#fafbfc" stroke="#8fa0b0" stroke-width="1"/><text x="80" y="737" text-anchor="start" font-size="14" fill="#1c2733" font-weight="600">Programming</text><text x="380" y="737" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">BOOT GPIO0, EN, TX0/RX0 GPIO43/44</text><text x="1050" y="737" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">buttons SW4/SW5, header J6, pull-up 10 kΩ, pull-down R15</text><rect x="60" y="758" width="1480" height="54" fill="#ffffff" stroke="#8fa0b0" stroke-width="1"/><text x="80" y="791" text-anchor="start" font-size="14" fill="#1c2733" font-weight="600">Power</text><text x="380" y="791" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">VBUS 12 V, FUSED_12V, OBD_12V, +3.3 V, GND</text><text x="1050" y="791" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">0.20 mm, with the Power class at 0.40 mm on the SW and stick branches, ground is a polygon</text></g></svg>