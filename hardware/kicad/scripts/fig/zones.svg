<svg xmlns="http://www.w3.org/2000/svg" width="1870" height="1725" viewBox="0 0 1870 1725"><!-- Generated by hardware/kicad/scripts/generate_figures.py. Repository figure, English. The project's written documentation uses a separate figure set from its own generator, with the same file names but different drawings. Edit this file by editing the generator, never by hand. --><rect width="1870" height="1725" fill="#ffffff"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="46" font-size="26" font-weight="700" fill="#1c2733">Functional zone layout on the printed circuit board</text><text x="40" y="72" font-size="15" fill="#5c6b7a">Two-layer FR4 130 × 115 mm, revision v0.7</text><line x1="40" y1="88" x2="1560" y2="88" stroke="#8fa0b0" stroke-width="2"/><rect x="90" y="120" width="1690" height="1495" rx="8" fill="#fbfcfd" stroke="#1c2733" stroke-width="3"/><text x="935" y="104" text-anchor="middle" font-size="14" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">130 mm</text><text x="12" y="867" text-anchor="start" font-size="14" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">115 mm</text><text x="90" y="1661" text-anchor="start" font-size="14" fill="#b8860b" font-weight="400">The OBD connector J2 and USB-C J1 share the top edge, USB-A J4 is on the bottom one. The interface sits on a single vertical axis along the right edge.</text><text x="90" y="1685" text-anchor="start" font-size="14" fill="#5c6b7a" font-weight="400">Every passive is THT and the resistors lie flat, which is why the board grew to 130 × 115 mm. Components are on the top side only.</text></g></svg>