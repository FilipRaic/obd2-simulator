<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><!-- Generated by hardware/kicad/scripts/generate_figures.py. Repository figure, English. The project's written documentation uses a separate figure set from its own generator, with the same file names but different drawings. Edit this file by editing the generator, never by hand. --><rect width="1600" height="1000" fill="#ffffff"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="46" font-size="26" font-weight="700" fill="#1c2733">Schematic 3: ESP32-S3-WROOM-1, external flash and USB subsystem</text><text x="40" y="72" font-size="15" fill="#5c6b7a">ESP32-S3 pin numbering. Revision v0.7, with SPI series termination and test points</text><line x1="40" y1="88" x2="1560" y2="88" stroke="#8fa0b0" stroke-width="2"/><rect x="560" y="130" width="300" height="480" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="710" y="154" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">ESP32-S3-WROOM-1 (U6)</text><text x="710" y="176" text-anchor="middle" font-size="13" fill="#5c6b7a">dual core 240 MHz</text><text x="710" y="193" text-anchor="middle" font-size="13" fill="#5c6b7a">8 MB flash, 512 KB SRAM</text><text x="710" y="210" text-anchor="middle" font-size="13" fill="#5c6b7a">the only SPI master</text><path d="M 560 220 L 400 220" fill="none" stroke="#1c2733" stroke-width="2"/><text x="395" y="225" text-anchor="end" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO11  MOSI -&gt; R31 33 Ω</text><path d="M 560 250 L 400 250" fill="none" stroke="#1c2733" stroke-width="2"/><text x="395" y="255" text-anchor="end" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO13  MISO</text><path d="M 560 280 L 400 280" fill="none" stroke="#1c2733" stroke-width="2"/><text x="395" y="285" text-anchor="end" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO12  SCK -&gt; R30 33 Ω</text><path d="M 560 320 L 400 320" fill="none" stroke="#1c2733" stroke-width="2"/><text x="395" y="325" text-anchor="end" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO10  CS-CAN</text><path d="M 560 350 L 400 350" fill="none" stroke="#1c2733" stroke-width="2"/><text x="395" y="355" text-anchor="end" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO9  INT-CAN</text><path d="M 560 390 L 400 390" fill="none" stroke="#1c2733" stroke-width="2"/><text x="395" y="395" text-anchor="end" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO14  CS-TFT</text><path d="M 560 420 L 400 420" fill="none" stroke="#1c2733" stroke-width="2"/><text x="395" y="425" text-anchor="end" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO21  DC/RS</text><path d="M 560 450 L 400 450" fill="none" stroke="#1c2733" stroke-width="2"/><text x="395" y="455" text-anchor="end" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO47  RST-TFT</text><path d="M 560 490 L 400 490" fill="none" stroke="#1c2733" stroke-width="2"/><text x="395" y="495" text-anchor="end" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO15  CS-FLASH</text><path d="M 560 570 L 400 570" fill="none" stroke="#1c2733" stroke-width="2"/><text x="395" y="575" text-anchor="end" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">EN  RESET (SW5, R13 + C26)</text><path d="M 560 600 L 400 600" fill="none" stroke="#1c2733" stroke-width="2"/><text x="395" y="605" text-anchor="end" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO0  BOOT (SW4, R14)</text><path d="M 860 220 L 1010 220" fill="none" stroke="#1c2733" stroke-width="2"/><text x="1015" y="225" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO1  ENC-A </text><path d="M 860 250 L 1010 250" fill="none" stroke="#1c2733" stroke-width="2"/><text x="1015" y="255" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO38  ENC-B </text><path d="M 860 280 L 1010 280" fill="none" stroke="#1c2733" stroke-width="2"/><text x="1015" y="285" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO39  ENC-SW </text><path d="M 860 310 L 1010 310" fill="none" stroke="#1c2733" stroke-width="2"/><text x="1015" y="315" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO2  JOY-X (ADC1_CH1)</text><path d="M 860 340 L 1010 340" fill="none" stroke="#1c2733" stroke-width="2"/><text x="1015" y="345" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO4  JOY-Y (ADC1_CH3)</text><path d="M 860 370 L 1010 370" fill="none" stroke="#1c2733" stroke-width="2"/><text x="1015" y="375" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO5  JOY-SW </text><path d="M 860 400 L 1010 400" fill="none" stroke="#1c2733" stroke-width="2"/><text x="1015" y="405" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO6  SW1 CONFIRM </text><path d="M 860 430 L 1010 430" fill="none" stroke="#1c2733" stroke-width="2"/><text x="1015" y="435" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO7  SW2 CLEAR </text><path d="M 860 460 L 1010 460" fill="none" stroke="#1c2733" stroke-width="2"/><text x="1015" y="465" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO8  SW3 RETURN </text><path d="M 860 500 L 1010 500" fill="none" stroke="#1c2733" stroke-width="2"/><text x="1015" y="505" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO16  USB-SEL (pull-down R15) </text><path d="M 860 530 L 1010 530" fill="none" stroke="#1c2733" stroke-width="2"/><text x="1015" y="535" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO17  USB-HOST-EN </text><path d="M 860 500 L 1010 500" fill="none" stroke="#1c2733" stroke-width="2"/><text x="1015" y="505" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO19  USB D- (fixed OTG)</text><path d="M 860 530 L 1010 530" fill="none" stroke="#1c2733" stroke-width="2"/><text x="1015" y="535" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO20  USB D+ (fixed OTG)</text><path d="M 860 560 L 1010 560" fill="none" stroke="#1c2733" stroke-width="2"/><text x="1015" y="565" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO43/44  TX0 / RX0, header J6 (UART) </text><rect x="120" y="430" width="230" height="120" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="235" y="454" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">S25FL128L (U7)</text><text x="235" y="476" text-anchor="middle" font-size="13" fill="#5c6b7a">16 MB NOR flash, SPI</text><text x="235" y="493" text-anchor="middle" font-size="13" fill="#5c6b7a">FAT filesystem with the scenarios</text><text x="235" y="510" text-anchor="middle" font-size="13" fill="#5c6b7a">WP and HOLD on +3.3 V</text><path d="M 350 490 L 400 490" fill="none" stroke="#1c2733" stroke-width="2"/><rect x="120" y="650" width="250" height="110" rx="6" fill="#ffe9d6" stroke="#b03030" stroke-width="2"/><text x="245" y="674" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">R30, R31</text><text x="245" y="696" text-anchor="middle" font-size="13" fill="#5c6b7a">33 Ω in series on SCK and MOSI</text><text x="245" y="713" text-anchor="middle" font-size="13" fill="#5c6b7a">right at the module pin</text><text x="245" y="730" text-anchor="middle" font-size="13" fill="#5c6b7a">SCK 4.0 mm, MOSI 10.5 mm</text><rect x="1180" y="600" width="250" height="100" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="1305" y="624" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">TS3USB221 (U9)</text><text x="1305" y="646" text-anchor="middle" font-size="13" fill="#5c6b7a">USB mux: USB-C or USB-A</text><rect x="1180" y="720" width="250" height="90" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="1305" y="744" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">SY6280 (U10)</text><text x="1305" y="766" text-anchor="middle" font-size="13" fill="#5c6b7a">stick power switch</text><text x="1305" y="783" text-anchor="middle" font-size="13" fill="#5c6b7a">5 V from converter U11</text><path d="M 1120 500 L 1160 500 L 1160 650 L 1180 650" fill="none" stroke="#8fa0b0" stroke-width="2"/><path d="M 1120 470 L 1140 470 L 1140 765 L 1180 765" fill="none" stroke="#8fa0b0" stroke-width="2"/><rect x="600" y="660" width="200" height="90" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="700" y="684" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">USB-C (J1)</text><text x="700" y="706" text-anchor="middle" font-size="13" fill="#5c6b7a">MSC link to a computer</text><text x="700" y="723" text-anchor="middle" font-size="13" fill="#5c6b7a">D4 USBLC6-2SC6</text><rect x="870" y="660" width="200" height="90" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="970" y="684" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">USB-A (J4)</text><text x="970" y="706" text-anchor="middle" font-size="13" fill="#5c6b7a">USB stick</text><text x="970" y="723" text-anchor="middle" font-size="13" fill="#5c6b7a">D5 USBLC6-2SC6</text><path d="M 800 705 L 1180 660" fill="none" stroke="#8fa0b0" stroke-width="2" stroke-dasharray="6 4"/><path d="M 1070 705 L 1180 690" fill="none" stroke="#8fa0b0" stroke-width="2" stroke-dasharray="6 4"/><text x="600" y="790" text-anchor="start" font-size="14" fill="#5c6b7a" font-weight="400">One USB OTG controller, so mux U9 switches it between USB-C and USB-A, with the stick taking precedence.</text><text x="600" y="828" text-anchor="start" font-size="14" fill="#5c6b7a" font-weight="400">Programming: USB-Serial-JTAG over USB-C (R15 holds the mux on the USB-C side during reset), the BOOT and RESET buttons, monitor on J6.</text><text x="120" y="630" text-anchor="start" font-size="14" fill="#5c6b7a" font-weight="400">The hatched area along the right edge of the module is the copper keep-out under the antenna (3 - 5 mm).</text><text x="120" y="130" text-anchor="start" font-size="14" fill="#5c6b7a" font-weight="400">The strapping pins (3, 45, 46) and the flash/PSRAM range (26 - 37) are avoided, and GPIO0 carries only the BOOT button (SW4).</text><text x="120" y="866" text-anchor="start" font-size="14" fill="#b03030" font-weight="400">SPI: the bus is 88 to 126 mm long and carries three loads (U4, U7, J5), so series termination at the source damps the reflection.</text><text x="120" y="890" text-anchor="start" font-size="14" fill="#b03030" font-weight="400">R30 and R31 of 33 Ω right at the output pin damp the reflection from the far end. Past the resistor lies net SCK / MOSI, while the module pin</text><text x="120" y="914" text-anchor="start" font-size="14" fill="#b03030" font-weight="400">drives net SCK_MCU and MOSI_MCU. Both CS lines (CS_CAN, CS_FLASH) have a 10 kΩ pull-up (R35, R36).</text><text x="600" y="866" text-anchor="start" font-size="14" fill="#b03030" font-weight="400">Both USB ports have ESD protection (D4, D5, USBLC6-2SC6). Pin 5 of those diodes goes to +3.3 V, not to VBUS,</text><text x="600" y="890" text-anchor="start" font-size="14" fill="#b03030" font-weight="400">because VBUS carries 12 V after the PD contract, while that pin stands off 5.25 V. USB_HOST_EN got the pull-down R37.</text><text x="120" y="948" text-anchor="start" font-size="14" fill="#5c6b7a" font-weight="400">Test points TP5 (MOSI), TP6 (MISO) and TP7 (SCK) tap at flash U7, that is at the middle of the bus, 4 to 5 mm from</text><text x="120" y="972" text-anchor="start" font-size="14" fill="#5c6b7a" font-weight="400">its leads, so they add no long stub. TP1 (3.3 V) and TP2 (ground) are on the display header, TP8 (VBUS) next to fuse F1.</text></g></svg>