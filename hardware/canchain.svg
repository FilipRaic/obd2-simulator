<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420"><!-- Generated by hardware/kicad/scripts/generate_figures.py. Repository figure, English. The project's written documentation uses a separate figure set from its own generator, with the same file names but different drawings. Edit this file by editing the generator, never by hand. --><rect width="1600" height="420" fill="#ffffff"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="46" font-size="26" font-weight="700" fill="#1c2733">CAN chain</text><text x="40" y="72" font-size="15" fill="#5c6b7a">MCP2515 -> SN65HVD230 -> 120 Ω termination -> ESD protection -> J1962F connector</text><line x1="40" y1="88" x2="1560" y2="88" stroke="#8fa0b0" stroke-width="2"/><rect x="40" y="160" width="230" height="120" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="155" y="184" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">MCP2515</text><text x="155" y="206" text-anchor="middle" font-size="13" fill="#5c6b7a">controller, SPI</text><path d="M 270 220 L 340 220" fill="none" stroke="#1c2733" stroke-width="3"/><rect x="340" y="160" width="230" height="120" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="455" y="184" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">SN65HVD230</text><text x="455" y="206" text-anchor="middle" font-size="13" fill="#5c6b7a">transceiver</text><path d="M 570 220 L 640 220" fill="none" stroke="#1c2733" stroke-width="3"/><rect x="640" y="160" width="230" height="120" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="755" y="184" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">R7 120 Ω</text><text x="755" y="206" text-anchor="middle" font-size="13" fill="#5c6b7a">termination</text><path d="M 870 220 L 940 220" fill="none" stroke="#1c2733" stroke-width="3"/><rect x="940" y="160" width="230" height="120" rx="6" fill="#f3f6f9" stroke="#1c2733" stroke-width="2"/><text x="1055" y="184" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">PESD1CAN</text><text x="1055" y="206" text-anchor="middle" font-size="13" fill="#5c6b7a">ESD protection</text><path d="M 1170 220 L 1240 220" fill="none" stroke="#1c2733" stroke-width="3"/><rect x="1240" y="160" width="230" height="120" rx="6" fill="#fff6e0" stroke="#b8860b" stroke-width="2"/><text x="1355" y="184" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2733">J1962F</text><text x="1355" y="206" text-anchor="middle" font-size="13" fill="#5c6b7a">OBD-II connector</text><text x="285" y="205" text-anchor="start" font-size="12" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">TXCAN / RXCAN</text><text x="585" y="205" text-anchor="start" font-size="12" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">CAN-H / CAN-L</text><text x="885" y="205" text-anchor="start" font-size="12" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">same pair</text><text x="1185" y="205" text-anchor="start" font-size="12" fill="#5c6b7a" font-weight="400" font-family="DejaVu Sans Mono, Consolas, monospace">same pair</text><text x="40" y="330" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400">The order is prescribed and that is how it is actually routed: termination before the ESD diode, the ESD diode right at the connector.</text><text x="40" y="356" text-anchor="start" font-size="13" fill="#5c6b7a" font-weight="400">D1 is 9.0 mm from pin 14, R7 is 4.0 mm from D1. Closer is impossible: the J1962F contacts sit inside a 43.3 x 20.7 mm body.</text><text x="40" y="384" text-anchor="start" font-size="13" fill="#b8860b" font-weight="400">Connector pin 16 carries 12 V from the power section, through F1 and the blocking diode D3 (SMAJ16A).</text></g></svg>