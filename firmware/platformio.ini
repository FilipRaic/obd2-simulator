; OBD-II simulator firmware.
; The portable protocol core lives one directory up (include/ + src/) and is
; compiled into every environment by import_core.py. This project adds the
; hardware-first layers: hal, can, app, ui, storage.
;
;   pio run  -e custom-board  ESP32-S3-WROOM-1 (dedicated PCB and the
;                             breadboard adapter used during development)
;   pio test -e native        host-side protocol tests (tests/test_simulator.cpp)

[platformio]
default_envs = custom-board
test_dir     = ../tests

[env]
extra_scripts = pre:import_core.py
build_unflags = -std=gnu++11
build_flags   = -std=gnu++17

; ── Shared Arduino/ESP32 settings ───────────────────────────────────────────
[esp32_common]
framework     = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.4
; TFT_eSPI is configured entirely from build flags (no User_Setup.h edits).
tft_common =
    -DUSER_SETUP_LOADED=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    ; MANDATORY on the ESP32-S3. Without it the firmware panics on the first
    ; SPI write inside tft.init(), and the board reboots forever.
    ;
    ; TFT_eSPI writes the SPI peripheral registers directly, through pointers
    ; built as REG_SPI_BASE(SPI_PORT) + offset. Its default branch for the S3
    ; (Processors/TFT_eSPI_ESP32_S3.h, line 83) is `#define SPI_PORT FSPI`,
    ; and FSPI in the Arduino core is 0 for the S3 - an index into the core's
    ; own bus array, NOT a peripheral number. The SDK's REG_SPI_BASE(i) is
    ;     ((i)>=2) ? (DR_REG_SPI2_BASE + (i-2)*0x1000) : (0)
    ; so index 0 yields base 0, and SET_BUS_WRITE_MODE stores to
    ; SPI_USER_REG(0) = 0x00000010. That is the crash: StoreProhibited at
    ; 0x10, diagnosed 21.08.2026. from the core dump - backtrace
    ; begin_tft_write -> writecommand(0x00) -> init(), TFT_eSPI.cpp:81.
    ;
    ; USE_FSPI_PORT forces SPI_PORT to the literal 2, which REG_SPI_BASE maps
    ; to DR_REG_SPI2_BASE - the GPSPI2 the Arduino core's global SPI object
    ; actually drives on the S3 (_spi_bus_array[0] in esp32-hal-spi.c). The
    ; registers then belong to the same peripheral hal::spi_bus_init() opened.
    ; USE_HSPI_PORT would be wrong here: it selects SPI3, which nothing on
    ; this board is attached to.
    ;
    ; The flag appears in exactly one place in the whole library, the SPI_PORT
    ; choice, so it changes nothing else - `spi` stays bound to the global SPI.
    -DUSE_FSPI_PORT=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1

; ── ESP32-S3-WROOM-1: dedicated PCB and breadboard adapter ──────────────────
; One hardware-first target. The same module runs on the adapter board during
; development and on the dedicated PCB. See include/pins_custom_s3.h.
[env:custom-board]
platform      = espressif32@^6.7.0
board         = esp32-s3-devkitc-1
; Upload goes over USB-C through the S3's ROM USB-Serial-JTAG (no external
; bridge chip), and needs no button presses: the application leaves the
; TS3USB221 mux parked on the USB-C side and never calls USB.begin(), so the
; USB PHY stays routed to the USB-Serial-JTAG controller and esptool can enter
; download mode by itself.
;
; Enter download mode MANUALLY - hold BOOT (SW4), tap RESET (SW5), release
; BOOT - only in the two cases where that port is gone: the MSC device role
; (USB.begin() has claimed the OTG controller) and a firmware that hangs
; before pins_init_normal_mode() runs.
;
; NOTE (09.08.2026.): until then the application parked the mux on USB-A, so
; the manual dance was needed on EVERY upload, not just in MSC mode. See the
; comment on pins_init_normal_mode() in src/storage/usb_msc_device.cpp.
;
; The 115200-baud monitor is on UART0 (header J6) - use any USB-UART adapter
; with `pio device monitor`. That header has no DTR/RTS, so the UART path
; cannot enter download mode on its own; it needs the buttons.
; USB OTG (TinyUSB) mode for the MSC device role, while serial stays on UART0.
; Set here because the board manifest already defines these macros.
board_build.extra_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
framework     = ${esp32_common.framework}
monitor_speed = ${esp32_common.monitor_speed}
lib_deps      = ${esp32_common.lib_deps}
build_flags =
    ${env.build_flags}
    ${esp32_common.tft_common}
    -DBOARD_CUSTOM_S3=1
    ; TFT_eSPI's clock, so this applies to the DISPLAY only. The other two
    ; peripherals set their own and are far below it: MCP2515 runs at 10 MHz
    ; (its own maximum) and the NOR flash at 20 MHz, both in their drivers.
    ;
    ; The note that used to stand here, "PCB traces < 30 mm allow the full
    ; documented 40 MHz", was wrong: on the v0.9b board SCK is 114 mm, MOSI
    ; 92 mm and MISO 83 mm. That is why R30 and R31 (33 ohm at the module pin)
    ; exist. 40 MHz over that length is the value to VERIFY on the assembled
    ; board, not one the layout justifies - if the display shows artefacts,
    ; halve this first.
    -DSPI_FREQUENCY=40000000
    ; TFT_MISO IS THE BUS MISO, EVEN THOUGH THE DISPLAY HAS NO DATA-OUT LINE.
    ;
    ; The Waveshare module (18366) is write-only - its 8-pin interface carries
    ; no MISO, and this line used to say so and leave TFT_MISO undefined. That
    ; silenced the MCP2515 and the flash from 21.08.2026. until this was found
    ; on 22.08.2026., through the following chain:
    ;
    ;   1. USE_FSPI_PORT above does more than pick a register base. In
    ;      Processors/TFT_eSPI_ESP32_S3.c the library declares its own bus
    ;      object, `SPIClass spi = SPIClass(FSPI)`, instead of the
    ;      `SPIClass& spi = SPI` it uses without that flag.
    ;   2. That object's _spi is null, so the spi.begin(TFT_SCLK, TFT_MISO,
    ;      TFT_MOSI, -1) inside TFT_eSPI::initBus() really executes, where the
    ;      global SPI's begin() would have returned at once.
    ;   3. With TFT_MISO undefined, TFT_eSPI_ESP32_S3.h line 340 maps it to
    ;      TFT_MOSI, and begin() then calls spiAttachMISO(spi, 11).
    ;   4. The MISO input of SPI2 is thereby re-routed from GPIO13 to GPIO11.
    ;      Writes are untouched, so the display works, while every readback on
    ;      the bus returns nothing: the MCP2515 self-test reads 0x00 instead of
    ;      0x55 and the flash JEDEC id comes back 00 00 00.
    ;
    ; Naming the real MISO pin makes step 4 re-attach GPIO13 to GPIO13, which
    ; is what the bus already had. The display neither gains nor loses
    ; anything - it still never reads. Measured on the board: a software
    ; bit-banged probe on the same pins answered `jedec 01 60 18` and
    ; `cnf1 55` while the hardware SPI in the same boot answered zeroes, which
    ; is what pointed at the peripheral rather than at the copper.
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=14
    -DTFT_DC=21
    -DTFT_RST=47

; ── Bring-up build: console on USB-C instead of UART0 ───────────────────────
; Added 20.08.2026., during first power-up of the assembled v0.7 board.
;
; Why it exists: with the normal `custom-board` flags the console is on UART0,
; header J6, and that needs a USB-UART adapter nobody had at hand. Worse, once
; the application takes over from the ROM the USB-Serial-JTAG device disappears
; from the PC completely - measured, 383 samples over 20 s, not one sighting -
; because IDF startup leaves the peripheral's clock off when the console does
; not use it. So an assembled board that boots looks exactly like a dead one.
;
; ARDUINO_USB_MODE=1 puts `Serial` on the USB-Serial-JTAG hardware, so the boot
; log, `Serial.printf` and any panic backtrace all come out over USB-C, and the
; device stays enumerated while the application runs.
;
; Cost: the MSC device role needs the OTG controller (ARDUINO_USB_MODE=0), so
; USB disk mode does NOT work in this build. Everything else does. Use
; `custom-board` for anything that ships.
[env:custom-board-bringup]
extends = env:custom-board
board_build.extra_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; 115200 for both upload paths. Over USB-Serial-JTAG the baud rate is a
; fiction the peripheral ignores, so nothing is lost there; over the Arduino
; Micro bridge on J6 (tools/uart-bridge-micro) it is real, and that bridge
; moves bytes one at a time on a 16 MHz AVR, where a rate it cannot keep up
; with is lost bytes - the exact failure this path exists to avoid. 450 kB at
; 115200 is about 40 s, which is fast enough not to need the risk.
upload_speed = 115200
; Display clock halved for bring-up, as odjeljak 10 of the commissioning note
; asks: 40 MHz was never justified by the layout (SCK is 114 mm), it is a value
; to verify on the assembled board. -U first, because the inherited
; custom-board build_flags already define it.
; BRINGUP_DIAG turns on hal/crash_report: the reset reason and the core dump
; summary of the previous boot, printed slowly enough to survive USB-C. It is
; the answer to the missing panic text - the panic handler writes to the
; PRIMARY console, which this SDK sets to UART0, so over USB only stray bytes
; ever arrived. The dump itself is complete and sits in flash. See
; src/hal/crash_report.h.
build_flags =
    ${env:custom-board.build_flags}
    -USPI_FREQUENCY
    -DSPI_FREQUENCY=20000000
    -DBRINGUP_DIAG=1

; ── Host-side protocol tests (no hardware-first) ──────────────────────────────────
; Builds the protocol core plus tests/test_simulator.cpp, which carries its
; own main() and platform stubs, and its exit code is the failure count.
[env:native]
platform         = native
test_framework   = custom
build_src_filter = -<*>
